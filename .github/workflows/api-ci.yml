name: API CI

on:
  push:
    branches: [ "main", "develop", "v2" ]
  pull_request:
    branches: [ "main", "develop", "v2" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Setup Python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # Cache dependencies
      # =========================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 fastapi

      # =========================
      # Set PYTHONPATH (SINGLE SOURCE OF TRUTH)
      # =========================
      - name: Run tests
        run: |
          PYTHONPATH=.:backend/core pytest --cov=backend

      # =========================
      # Code formatting check
      # =========================
      - name: Check formatting (black)
        run: black --check backend/

      # =========================
      # Linting
      # =========================
      - name: Run lint (flake8)
        run: flake8 backend/